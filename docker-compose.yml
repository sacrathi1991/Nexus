services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nexus_redisdata:/data
    # --save + --appendonly give Redis basic disk persistence (so cached
    # entries survive a container restart) - not required for a pure
    # cache (TTL + the real pipeline as fallback already make data loss
    # harmless), but costs nothing to enable and avoids a cold cache on
    # every restart during development.
    command: redis-server --save 60 1 --appendonly yes

volumes:
  nexus_pgdata:
  nexus_redisdata:
